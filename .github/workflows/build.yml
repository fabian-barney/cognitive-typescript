name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build / build-${{ matrix.os }}-${{ matrix.node }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            node: node22
            node-version: "22.23.4"
          - os: windows
            runner: windows-latest
            node: node24
            node-version: "24.22.1"
          - os: windows
            runner: windows-latest
            node: node26
            node-version: "26.12.1"
          - os: macos
            runner: macos-latest
            node: node22
            node-version: "22.23.4"
          - os: macos
            runner: macos-latest
            node: node24
            node-version: "24.22.1"
          - os: macos
            runner: macos-latest
            node: node26
            node-version: "26.12.1"
          - os: ubuntu
            runner: ubuntu-latest
            node: node22
            node-version: "22.23.4"
          - os: ubuntu
            runner: ubuntu-latest
            node: node24
            node-version: "24.22.1"
          - os: ubuntu
            runner: ubuntu-latest
            node: node26
            node-version: "26.12.1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up npm 12.2.1
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test-unit:
    name: test / test-unit-${{ matrix.os }}-${{ matrix.node }}
    needs:
      - build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            node: node22
            node-version: "22.23.4"
          - os: windows
            runner: windows-latest
            node: node24
            node-version: "24.22.1"
          - os: windows
            runner: windows-latest
            node: node26
            node-version: "26.12.1"
          - os: macos
            runner: macos-latest
            node: node22
            node-version: "22.23.4"
          - os: macos
            runner: macos-latest
            node: node24
            node-version: "24.22.1"
          - os: macos
            runner: macos-latest
            node: node26
            node-version: "26.12.1"
          - os: ubuntu
            runner: ubuntu-latest
            node: node22
            node-version: "22.23.4"
          - os: ubuntu
            runner: ubuntu-latest
            node: node24
            node-version: "24.22.1"
          - os: ubuntu
            runner: ubuntu-latest
            node: node26
            node-version: "26.12.1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up npm 12.2.1
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: |
          npm test
          npm run test:release

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.runner }}-${{ matrix.node-version }}
          path: coverage
          if-no-files-found: error

  lint:
    name: verify / lint
    runs-on: ubuntu-latest
    needs:
      - workspace-packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm

      - name: Set up npm 12.2.1
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: |
          npm run lint
          npm run format:check

  workspace-packages:
    name: package / workspace-packages
    runs-on: ubuntu-latest
    needs:
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm

      - name: Set up npm 12.2.1
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify workspace packages
        run: |
          npm run test:release
          npm run release:artifacts

      - name: Upload workspace packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-packages
          path: release-artifacts/
          if-no-files-found: error

  consumer:
    name: test / consumer-${{ matrix.os }}-${{ matrix.node-version }}
    needs: workspace-packages
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: ["22.23.4", "24.22.1", "26.12.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm install --global npm@12.2.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workspace-packages
          path: release-artifacts
      - name: Verify packaged consumers
        run: npm run release:smoke -- --artifacts-dir release-artifacts

  consumer-minimum:
    name: test / consumer-minimum-${{ matrix.node-version }}
    needs: workspace-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.13.0", "24.0.0", "26.0.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Consumer installs retain npm 11; source builds and artifact generation use npm 12.
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: workspace-packages
          path: release-artifacts
      - name: Verify published runtime minimums
        run: npm run release:smoke -- --artifacts-dir release-artifacts

  quality-crap:
    name: verify / quality-crap
    runs-on: ubuntu-latest
    needs:
      - workspace-packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm

      - name: Set up npm 12.2.1
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-ubuntu-latest-24.22.1
          path: coverage

      - name: Run crap-typescript gate
        run: npm run crap-typescript-check

  quality-cognitive:
    name: verify / quality-cognitive
    runs-on: ubuntu-latest
    needs:
      - workspace-packages

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm

      - name: Set up npm 12.2.1
        run: npm install --global npm@12.2.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run cognitive-typescript gate
        run: npm run cognitive-typescript-check

  required:
    name: verify / required
    if: always()
    needs: [build, test-unit, lint, workspace-packages, consumer, consumer-minimum, quality-crap, quality-cognitive]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gates to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); if(Object.values(jobs).some(job=>job.result!=="success")) process.exit(1)'
