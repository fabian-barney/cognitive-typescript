name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node 24.0.0
        uses: actions/setup-node@v6
        with:
          node-version: "24.0.0"
          cache: npm

      - name: Set up npm 11.15.0
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Verify release versions
        run: npm run verify-release-version

      - name: Render release notes
        run: npm run --silent render-release-notes -- "${GITHUB_REF_NAME}" > release-notes.md

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Build workspace packages
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run cognitive-typescript gate
        run: npm run cognitive-typescript-check

      - name: Run crap-typescript gate
        run: npm run crap-typescript-check

      - name: Build publish artifacts
        run: |
          mkdir -p release-artifacts
          npm pack --workspaces --pack-destination release-artifacts
          cp release-notes.md release-artifacts/release-notes.md

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release-artifacts/
          if-no-files-found: error

  draft:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Create GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --draft --verify-tag \
              --title "${GITHUB_REF_NAME}" --notes-file release-artifacts/release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
              --title "${GITHUB_REF_NAME}" --notes-file release-artifacts/release-notes.md
          fi

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - validate
      - draft
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node 24.0.0
        uses: actions/setup-node@v6
        with:
          node-version: "24.0.0"
          registry-url: "https://registry.npmjs.org"

      - name: Set up npm 11.15.0
        run: npm install --global npm@11.15.0

      - name: Download publish artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Publish packages
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm publish "./release-artifacts/barney-media-cognitive-typescript-core-${version}.tgz" --access public
          npm publish "./release-artifacts/barney-media-cognitive-typescript-${version}.tgz" --access public
          npm publish "./release-artifacts/barney-media-cognitive-typescript-vitest-${version}.tgz" --access public
          npm publish "./release-artifacts/barney-media-cognitive-typescript-jest-${version}.tgz" --access public

  finalize:
    name: Finalize GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write

    steps:
      - name: Set up Node 24.0.0
        uses: actions/setup-node@v6
        with:
          node-version: "24.0.0"
          registry-url: "https://registry.npmjs.org"

      - name: Set up npm 11.15.0
        run: npm install --global npm@11.15.0

      - name: Verify published package versions
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for package in \
            "@barney-media/cognitive-typescript-core" \
            "@barney-media/cognitive-typescript" \
            "@barney-media/cognitive-typescript-vitest" \
            "@barney-media/cognitive-typescript-jest"
          do
            published="$(npm view "${package}@${version}" version)"
            test "${published}" = "${version}"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false --verify-tag
